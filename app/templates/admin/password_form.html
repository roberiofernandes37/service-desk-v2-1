{% extends "base.html" %}
{% block content %}
<section class="page-title">
  <div>
    <h1>Redefinir senha</h1>
    <p>{{ user.name }} - {{ user.email }}</p>
  </div>
  <div class="title-actions">
    <a class="button" href="{{ url_for('admin.users') }}">Voltar</a>
  </div>
</section>

<section class="panel narrow">
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>{{ form.new_password.label }}{{ form.new_password() }}</label>
    <label>{{ form.confirm_password.label }}{{ form.confirm_password() }}</label>
    <button type="submit" class="btn btn-primary fw-bold shadow-sm"><i class="fa-solid fa-key me-2"></i>{{ form.submit.label.text }}</button>
  </form>
</section>
{% endblock %}
