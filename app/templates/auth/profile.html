{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Meu perfil</h1>
  <p class="muted">{{ current_user.name }} · {{ current_user.email }}</p>
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>{{ form.current_password.label }}{{ form.current_password() }}</label>
    <label>{{ form.new_password.label }}{{ form.new_password() }}</label>
    <label>{{ form.confirm_password.label }}{{ form.confirm_password() }}</label>
    <button type="submit" class="btn btn-primary fw-bold shadow-sm"><i class="fa-solid fa-save me-2"></i>{{ form.submit.label.text }}</button>
  </form>
</section>
{% endblock %}
